name: Pendências - resumo diário (push)

on:
  schedule:
    # Horário em UTC. 11:00 UTC = 08:00 em Brasília. Para 19:00, acrescente: - cron: "0 22 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: pendencias/push
      - run: node send.mjs
        working-directory: pendencias/push
        env:
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
